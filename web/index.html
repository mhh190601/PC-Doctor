<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电脑医生桌面版</title>
    <script type="text/javascript" src="/eel.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #eef1f5; height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .container {
            width: 100%; max-width: 1000px; height: 95vh; background: #fff; border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden;
        }

        /* 顶部标题栏 */
        .header {
            background: #fff; border-bottom: 1px solid #eef0f4; padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between; z-index: 10;
        }
        .header .logo { font-size: 18px; font-weight: 700; color: #1a1a2e; }
        .header .logo span { color: #5b6af0; }
        .header .actions { display: flex; gap: 10px; }

        /* 主内容区 */
        .main-content { display: flex; flex: 1; overflow: hidden; }

        /* 左侧导航 */
        .nav {
            width: 180px; background: #f8f9fb; border-right: 1px solid #eef0f4;
            display: flex; flex-direction: column; padding: 10px 0;
        }
        .nav-item {
            padding: 12px 20px; cursor: pointer; font-size: 14px; color: #555;
            display: flex; align-items: center; gap: 10px; transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { background: #eef1f8; }
        .nav-item.active { background: #e8ecf5; color: #5b6af0; border-left-color: #5b6af0; font-weight: 600; }

        /* 右侧面板区 */
        .panel-container { flex: 1; background: #f5f6fa; overflow-y: auto; position: relative; }
        .panel { display: none; padding: 20px; height: 100%; }
        .panel.active { display: block; }

        /* 聊天气泡样式 */
        .chat-box { display: flex; flex-direction: column; gap: 14px; height: 100%; }
        .messages { flex: 1; overflow-y: auto; padding-bottom: 10px; display: flex; flex-direction: column; gap: 12px; }
        .message {
            max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 14px;
            line-height: 1.6; word-break: break-word; white-space: pre-wrap;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .user-msg { align-self: flex-end; background: #5b6af0; color: #fff; border-bottom-right-radius: 4px; }
        .ai-msg { align-self: flex-start; background: #fff; border: 1px solid #e8ecf1; border-bottom-left-radius: 4px; }
        .ai-diagnosis { border-left: 4px solid #7c5ce7; background: #fdfbff; }

        .feedback-area { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .feedback-area button {
            padding: 4px 10px; border: 1px solid #ddd; border-radius: 12px;
            background: #fff; cursor: pointer; font-size: 12px;
        }
        .feedback-area button:hover { background: #f0f0f5; }
        .feedback-area .add-knowledge-btn { color: #5b6af0; border-color: #5b6af0; }

        .input-area { display: flex; gap: 10px; margin-top: auto; padding: 12px 0 0; }
        .input-area input {
            flex: 1; padding: 12px 16px; border: 2px solid #e8ecf1; border-radius: 24px;
            font-size: 14px; outline: none; background: #f8f9fb;
        }
        .input-area input:focus { border-color: #5b6af0; background: #fff; }
        .input-area button {
            padding: 12px 20px; background: #5b6af0; color: #fff; border: none;
            border-radius: 24px; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        /* 优化工具卡片 */
        .tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 10px; }
        .tool-card {
            background: #fff; border: 1px solid #e8ecf1; border-radius: 12px; padding: 18px;
            cursor: pointer; transition: all 0.15s; text-align: center;
        }
        .tool-card:hover { background: #f0f2f8; border-color: #c4c9d4; }
        .tool-card .icon { font-size: 28px; margin-bottom: 8px; }
        .tool-card .name { font-size: 14px; color: #333; font-weight: 500; }

        /* 工具箱结果列表 */
        .result-list { background: #fff; border-radius: 12px; padding: 16px; margin-top: 10px; }
        .result-item { padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }

        /* 树形文件夹样式 */
        .tree { list-style: none; padding-left: 18px; font-size: 13px; line-height: 1.8; }
        .tree li { cursor: default; }
        .tree span { margin-left: 6px; }

        /* 状态栏 */
        .status-bar {
            background: #fff; border-top: 1px solid #eef0f4; padding: 8px 20px;
            display: flex; gap: 20px; font-size: 12px; color: #666;
        }
        .status-item { display: flex; align-items: center; gap: 6px; }
        .status-bar progress { height: 6px; width: 80px; border-radius: 4px; }
        .status-bar progress::-webkit-progress-bar { background-color: #eee; border-radius: 4px; }
        .status-bar progress::-webkit-progress-value { background-color: #5b6af0; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部 -->
    <div class="header">
        <div class="logo">🖥️ 电脑<span>医生</span></div>
        <div class="actions">
            <button onclick="switchPanel('settings')" style="background:none;border:none;cursor:pointer;font-size:18px;">⚙️</button>
        </div>
    </div>

    <!-- 主体 -->
    <div class="main-content">
        <!-- 导航 -->
        <div class="nav">
            <div class="nav-item active" data-panel="chat" onclick="switchPanel('chat')">💬 智能问答</div>
            <div class="nav-item" data-panel="optimize" onclick="switchPanel('optimize')">⚡ 系统优化</div>
            <div class="nav-item" data-panel="tools" onclick="switchPanel('tools')">🔧 工具箱</div>
            <div class="nav-item" data-panel="settings" onclick="switchPanel('settings')">⚙️ 设置</div>
        </div>

        <!-- 内容区 -->
        <div class="panel-container">
            <!-- 智能问答面板 -->
            <div class="panel active" id="panel-chat">
                <div class="chat-box">
                    <div class="messages" id="chatMessages">
                        <div class="message ai-msg">
                            👋 你好！我是电脑医生。<br><br>
                            💬 在下方输入你的电脑问题，我会尽力回答。<br>
                            👍 如果答案有用，点"有用"让我记住；没用就点"没用"，并可以补充正确答案教我。
                        </div>
                    </div>
                    <div class="input-area">
                        <input type="text" id="userInput" placeholder="描述你的电脑问题..." onkeydown="if(event.key==='Enter')sendDiagnosis()">
                        <button onclick="sendDiagnosis()">🔍 诊断</button>
                    </div>
                </div>
            </div>

            <!-- 系统优化面板 -->
            <div class="panel" id="panel-optimize">
                <h3 style="margin-bottom:16px;">⚡ 系统优化</h3>
                <div class="tool-grid">
                    <div class="tool-card" onclick="runOptimization('clean_temp_files', '清理临时文件')">
                        <div class="icon">🧹</div><div class="name">清理临时文件</div>
                    </div>
                    <div class="tool-card" onclick="runOptimization('run_disk_cleanup', '磁盘清理')">
                        <div class="icon">🪣</div><div class="name">磁盘清理</div>
                    </div>
                    <div class="tool-card" onclick="runOptimization('check_startup_items', '启动项检查')">
                        <div class="icon">⚡</div><div class="name">启动项检查</div>
                    </div>
                    <div class="tool-card" onclick="runOptimization('check_disk_space', '磁盘空间检查')">
                        <div class="icon">💾</div><div class="name">磁盘空间</div>
                    </div>
                    <div class="tool-card" onclick="runOptimization('check_rogue_software', '查流氓软件')">
                        <div class="icon">🛡️</div><div class="name">查流氓软件</div>
                    </div>
                    <div class="tool-card" onclick="runOptimization('check_dns', 'DNS检查')">
                        <div class="icon">🌐</div><div class="name">DNS检查</div>
                    </div>
                    <div class="tool-card" onclick="runOptimization('optimize_memory', '内存优化')">
                        <div class="icon">🧠</div><div class="name">内存优化</div>
                    </div>
                    <div class="tool-card" onclick="runAll()" style="border-color:#ff6b6b;">
                        <div class="icon">✨</div><div class="name" style="color:#ff6b6b;">一键全面优化</div>
                    </div>
                </div>
                <div id="optimizeResult" class="result-list" style="display:none;"></div>
            </div>

            <!-- 工具箱面板 -->
            <div class="panel" id="panel-tools">
                <h3 style="margin-bottom:16px;">🔧 工具箱</h3>
                <div class="tool-grid">
                    <div class="tool-card" onclick="scanLargeFiles()">
                        <div class="icon">📁</div><div class="name">大文件扫描</div>
                    </div>
                    <div class="tool-card" onclick="checkBootTime()">
                        <div class="icon">⏱️</div><div class="name">开机耗时分析</div>
                    </div>
                    <div class="tool-card" onclick="scanFolderTree()">
                        <div class="icon">🗂️</div><div class="name">文件夹空间分析</div>
                    </div>
                </div>
                <div id="toolResult" class="result-list" style="display:none;"></div>
            </div>

            <!-- 设置面板 -->
            <div class="panel" id="panel-settings">
                <h3 style="margin-bottom:16px;">⚙️ 设置</h3>
                <p style="color:#666;">更多设置功能即将推出...</p>
            </div>
        </div>
    </div>

    <!-- 底部状态栏 -->
    <div class="status-bar">
        <div class="status-item">🖥️ CPU: <span id="cpuValue">--</span>% <progress id="cpuBar" value="0" max="100"></progress></div>
        <div class="status-item">🧠 内存: <span id="memValue">--</span>% <progress id="memBar" value="0" max="100"></progress></div>
    </div>
</div>

<script>
    let currentUserQuestion = '';
    let currentKnowledgeId = null;

    // ========== 面板切换 ==========
    function switchPanel(panelName) {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        document.querySelector(`.nav-item[data-panel="${panelName}"]`).classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`panel-${panelName}`).classList.add('active');
    }

    // ========== 状态栏实时更新 ==========
    async function updateStatus() {
        try {
            const status = await eel.get_system_status()();
            if (!status.error) {
                document.getElementById('cpuValue').textContent = status.cpu_percent;
                document.getElementById('cpuBar').value = status.cpu_percent;
                document.getElementById('memValue').textContent = status.memory_percent;
                document.getElementById('memBar').value = status.memory_percent;
            }
        } catch(e) {}
    }
    setInterval(updateStatus, 2000);
    updateStatus();

    // ========== 消息与结果展示辅助 ==========
    function showResult(panelId, text) {
        const resultDiv = document.getElementById(panelId);
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<div style="padding:12px;white-space:pre-wrap;font-size:14px;">${text}</div>`;
    }

    function addChatMessage(text, type, extraClass='') {
        const messages = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = `message ${type}-msg ${extraClass}`;
        div.innerHTML = text.replace(/\n/g, '<br>');
        // 时间戳
        const time = document.createElement('div');
        time.style.cssText = 'font-size:11px;opacity:0.5;margin-top:6px;';
        const now = new Date();
        time.textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        div.appendChild(time);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    // ========== 优化功能（结果展示在优化面板） ==========
    async function runOptimization(funcName, displayName) {
        switchPanel('optimize');
        showResult('optimizeResult', `⏳ 正在执行：${displayName}...`);
        try {
            const result = await eel[funcName]()();
            showResult('optimizeResult', result);
        } catch (error) {
            showResult('optimizeResult', `执行 ${displayName} 出错：${error.message || error}`);
        }
    }

    async function runAll() {
        switchPanel('optimize');
        showResult('optimizeResult', '⏳ 执行一键全面优化，请稍候...');
        try {
            const report = await eel.run_all_optimizations()();
            showResult('optimizeResult', report);
        } catch (error) {
            showResult('optimizeResult', `全面优化出错：${error.message || error}`);
        }
    }

    // ========== 工具箱功能（结果展示在工具箱面板） ==========
    async function scanLargeFiles() {
        switchPanel('tools');
        const drive = prompt("请输入要扫描的盘符（例如 C:）：", "C:");
        if (!drive) return;
        showResult('toolResult', `正在扫描 ${drive} 的大文件（>50MB），请稍候...`);
        try {
            const result = await eel.scan_large_files(drive, 50)();
            if (result.error) { showResult('toolResult', `扫描出错：${result.error}`); return; }
            if (result.length === 0) {
                showResult('toolResult', `未发现超过50MB的大文件。`);
            } else {
                let msg = `📁 ${drive} 大文件：\n`;
                result.forEach((f,i) => { msg += `${i+1}. ${f.name} - ${f.size_mb} MB\n   📍 ${f.path}\n`; });
                showResult('toolResult', msg);
            }
        } catch (error) { showResult('toolResult', `扫描失败：${error}`); }
    }

    async function checkBootTime() {
        switchPanel('tools');
        showResult('toolResult', '正在分析开机信息...');
        try {
            const info = await eel.get_boot_info()();
            showResult('toolResult', `⏱️ 本次已运行：${info.uptime}\n🔄 上次开机耗时：${info.last_boot_time}`);
        } catch (error) { showResult('toolResult', `分析失败：${error}`); }
    }

    async function scanFolderTree() {
        switchPanel('tools');
        const drive = prompt("请输入要分析的盘符或目录（如 C:）：", "C:");
        if (!drive) return;
        showResult('toolResult', `正在分析 ${drive} 的空间分布，请稍候...`);
        try {
            const tree = await eel.scan_directory_tree(drive, 3, 15)();
            if (tree.error) { showResult('toolResult', `分析出错：${tree.error}`); return; }
            let html = `<strong>📊 ${tree.name} 空间分析 (总计 ${tree.size_mb.toFixed(1)} MB)</strong><ul class="tree">`;
            function buildTree(children) {
                if (!children || children.length===0) return '';
                let h = '';
                children.forEach(item => {
                    h += `<li>${item.is_dir?'📁':'📄'} ${item.name} <span style="color:#666;">${item.size_mb.toFixed(1)} MB</span>`;
                    if (item.children && item.children.length>0) h += `<ul>${buildTree(item.children)}</ul>`;
                    h += '</li>';
                });
                return h;
            }
            html += buildTree(tree.children) + '</ul>';
            document.getElementById('toolResult').innerHTML = `<div style="padding:12px;">${html}</div>`;
        } catch (error) { showResult('toolResult', `分析失败：${error}`); }
    }

    // ========== 智能问答（在聊天面板） ==========
    async function sendDiagnosis() {
        switchPanel('chat');
        const input = document.getElementById('userInput');
        const question = input.value.trim();
        if (!question) return;
        addChatMessage(question, 'user');
        input.value = '';
        currentUserQuestion = question;
        try {
            const result = await eel.ai_diagnose(question)();
            if (result.success) {
                const msgDiv = addChatMessage(result.answer, 'ai', 'ai-diagnosis');
                if (result.knowledge_id) {
                    const fb = document.createElement('div');
                    fb.className = 'feedback-area';
                    fb.innerHTML = `
                        <span style="font-size:12px;color:#888;">有帮助吗？</span>
                        <button onclick="submitFeedback(${result.knowledge_id},1,'${escapeHtml(question)}')">👍 有用</button>
                        <button onclick="submitFeedback(${result.knowledge_id},0,'${escapeHtml(question)}')">👎 没用</button>
                        <button class="add-knowledge-btn" onclick="showAddForm('${escapeHtml(question)}')">✏️ 补充</button>
                    `;
                    msgDiv.appendChild(fb);
                }
            } else {
                addChatMessage(result.message, 'ai', 'ai-diagnosis');
            }
        } catch (error) { addChatMessage(`诊断失败：${error.message || error}`, 'ai'); }
    }

    async function submitFeedback(kId, helpful, q) {
        await eel.submit_feedback(kId, helpful, q)();
        addChatMessage(helpful?'👍 感谢反馈！':'👎 感谢反馈，我会改进。', 'ai');
    }

    function showAddForm(q) {
        const ans = prompt(`为问题"${q}"补充你的答案：`);
        if (ans) {
            eel.add_user_knowledge(q, ans.trim())().then(()=>{
                addChatMessage('✅ 新知识已录入！', 'ai');
            });
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
</script>
</body>
</html>
